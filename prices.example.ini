# Per-seat MONTHLY price for each license SKU, so the report can turn a seat
# count into a dollar figure. Copy this file to prices.ini and fill in the
# numbers for the SKUs you care about.
#
# The name on the left is the SKU part number the report already prints in its
# "Seats purchased vs assigned" list (SPB, ENTERPRISEPACK, SPE_E3, ...). You do
# not have to price every SKU - the ones you skip just keep showing seat counts
# without a dollar figure. Anything after a ; or # on a line is a comment.
#
# In the full suite you usually do not edit this file by hand: after your first
# refresh, the console lists YOUR tenant's actual SKUs in prices.ini for you -
# open it, type the prices next to your SKUs, and refresh again.

[settings]
# The prefix shown before amounts. Default is $.
currency = $

[prices]
# SPB                   = 33.00   ; Microsoft 365 Business Premium
# ENTERPRISEPACK        = 23.00   ; Office 365 E3
# SPE_E3                = 36.00   ; Microsoft 365 E3
# SPE_E5                = 57.00   ; Microsoft 365 E5
# AAD_PREMIUM_P2        = 9.00    ; Entra ID P2
# EXCHANGEENTERPRISE    = 8.00    ; Exchange Online Plan 2
# VISIOCLIENT           = 15.00   ; Visio Plan 2
